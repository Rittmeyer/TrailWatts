name: trailwatt
description: Trailwatt - translates training targets into real routes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1       # Fraunces / Inter / IBM Plex Mono
  flutter_map: ^7.0.2        # for screens 04/05/02a2/02b3 (route + zone maps)
  latlong2: ^0.9.1
  table_calendar: ^3.1.2     # for screens 08a/08b/08c (calendar week/month)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
