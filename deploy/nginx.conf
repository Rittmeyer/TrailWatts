# Serving a Flutter web build is mostly about what must NOT be cached.
#
# The app is one HTML file plus a hashed bundle. index.html and the service
# worker are the only things that know which build is current, so caching
# either one pins a browser to an old release long after a deploy - the
# classic "I deployed but users still see the old app". Everything else is
# content-addressed by the Flutter build and can be cached hard.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compresses the one file that dominates the download: main.dart.js.
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;
    gzip_min_length   1024;

    # The router lives in the app, so any path it owns has to return the
    # shell rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Re-checking this on every load is what makes a deploy take effect.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|wasm|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # A single-page app has no reason to be framed or sniffed.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
